# On a version tag: cross-compiled binaries (Go + distkv-top) attached to a
# GitHub Release, plus multi-arch container images on GHCR. All free.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name=distkv_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}
          go build -trimpath -ldflags "-s -w -X github.com/UDogg/DistKV/internal/version.Version=${GITHUB_REF_NAME} -X github.com/UDogg/DistKV/internal/version.Commit=${GITHUB_SHA::7}" -o dist/$name/ ./cmd/...
          cp README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  distkv-top:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path clients/rust/Cargo.toml
      - run: tar -C clients/rust/target/release -czf distkv-top_${GITHUB_REF_NAME}_${{ runner.os }}.tar.gz distkv-top
      - uses: actions/upload-artifact@v4
        with:
          name: top-${{ runner.os }}
          path: distkv-top_*.tar.gz

  publish:
    needs: [binaries, distkv-top]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: distkv
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/udogg/distkv:${{ github.ref_name }},ghcr.io/udogg/distkv:latest
      - name: historian
        uses: docker/build-push-action@v7
        with:
          context: clients/python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/udogg/distkv-historian:${{ github.ref_name }},ghcr.io/udogg/distkv-historian:latest
