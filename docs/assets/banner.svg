<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="DistKV — Raft-based sharded distributed key-value cache">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070912"/>
      <stop offset="0.55" stop-color="#121735"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a48bff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#00d4ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .t { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; }
    .orbit { transform-origin: 930px 170px; animation: spin 40s linear infinite; }
    .orbit-rev { transform-origin: 930px 170px; animation: spin 60s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.35); } }
    .packet { offset-rotate: 0deg; animation: travel 2.4s cubic-bezier(.6,0,.4,1) infinite; }
    .p2 { animation-delay: .8s; } .p3 { animation-delay: 1.6s; }
    @keyframes travel { from { offset-distance: 0%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
    .blink { animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .chip { animation: rise .9s ease-out both; }
    .c2 { animation-delay: .15s; } .c3 { animation-delay: .3s; } .c4 { animation-delay: .45s; } .c5 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  </style>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowA)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowB)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#8c96ff" stroke-opacity=".18"/>

  <!-- Title -->
  <text x="64" y="128" class="t" font-size="86" font-weight="800" fill="#eef0ff" letter-spacing="-2">Dist<tspan fill="url(#brand)">KV</tspan></text>
  <text x="68" y="172" class="t" font-size="22" fill="#b9c0e6">Raft consensus · sharded multi-Raft · linearizable cache</text>
  <text x="68" y="208" class="mono" font-size="16" fill="#00d4ff">$ make demo<tspan class="blink" fill="#a48bff"> ▌</tspan></text>

  <!-- Stat chips -->
  <g class="t" font-size="15" font-weight="700">
    <g class="chip"><rect x="64" y="236" width="150" height="40" rx="12" fill="#2ee59d" fill-opacity=".12" stroke="#2ee59d" stroke-opacity=".5"/><text x="139" y="262" text-anchor="middle" fill="#2ee59d">10k ops/s</text></g>
    <g class="chip c2"><rect x="226" y="236" width="150" height="40" rx="12" fill="#ffb547" fill-opacity=".12" stroke="#ffb547" stroke-opacity=".5"/><text x="301" y="262" text-anchor="middle" fill="#ffb547">p99 &lt; 10 ms</text></g>
    <g class="chip c3"><rect x="388" y="236" width="170" height="40" rx="12" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-opacity=".5"/><text x="473" y="262" text-anchor="middle" fill="#00d4ff">100% under kill -9</text></g>
    <g class="chip c4"><rect x="570" y="236" width="150" height="40" rx="12" fill="#ff5ca8" fill-opacity=".12" stroke="#ff5ca8" stroke-opacity=".5"/><text x="645" y="262" text-anchor="middle" fill="#ff5ca8">linearizable</text></g>
  </g>
  <g class="t chip c5" font-size="13" fill="#8a93b8">
    <text x="66" y="306">Go  ·  TypeScript  ·  Python  ·  Rust  ·  zero third-party runtime dependencies</text>
  </g>

  <!-- Animated cluster: ring of 5 nodes, leader pulsing, replication packets -->
  <g>
    <circle cx="930" cy="170" r="118" fill="none" stroke="#8c96ff" stroke-opacity=".14" stroke-width="22"/>
    <g class="orbit">
      <circle cx="930" cy="170" r="118" fill="none" stroke="url(#brand)" stroke-width="3" stroke-dasharray="6 14" stroke-opacity=".7"/>
    </g>
    <g class="orbit-rev">
      <circle cx="930" cy="170" r="88" fill="none" stroke="#ff5ca8" stroke-width="1.5" stroke-dasharray="2 10" stroke-opacity=".5"/>
    </g>

    <!-- replication paths from the leader (top) to followers -->
    <path id="r1" d="M930 52 L1042 134" fill="none" stroke="#7c5cff" stroke-opacity=".25"/>
    <path id="r2" d="M930 52 L999 265" fill="none" stroke="#7c5cff" stroke-opacity=".25"/>
    <path id="r3" d="M930 52 L861 265" fill="none" stroke="#7c5cff" stroke-opacity=".25"/>
    <path id="r4" d="M930 52 L818 134" fill="none" stroke="#7c5cff" stroke-opacity=".25"/>
    <circle r="5" fill="#00d4ff" class="packet" style="offset-path: path('M930 52 L1042 134')"/>
    <circle r="5" fill="#00d4ff" class="packet p2" style="offset-path: path('M930 52 L999 265')"/>
    <circle r="5" fill="#00d4ff" class="packet p3" style="offset-path: path('M930 52 L861 265')"/>
    <circle r="5" fill="#00d4ff" class="packet p2" style="offset-path: path('M930 52 L818 134')"/>

    <!-- nodes -->
    <circle cx="930" cy="52" r="26" fill="#7c5cff" filter="url(#soft)" class="pulse"/>
    <circle cx="930" cy="52" r="20" fill="#7c5cff"/>
    <text x="930" y="58" text-anchor="middle" class="t" font-size="16" font-weight="800" fill="#fff">★</text>
    <circle cx="1042" cy="134" r="17" fill="#00d4ff"/><text x="1042" y="139" text-anchor="middle" class="t" font-size="12" font-weight="800" fill="#06101f">n2</text>
    <circle cx="999" cy="265" r="17" fill="#ff5ca8"/><text x="999" y="270" text-anchor="middle" class="t" font-size="12" font-weight="800" fill="#06101f">n3</text>
    <circle cx="861" cy="265" r="17" fill="#2ee59d"/><text x="861" y="270" text-anchor="middle" class="t" font-size="12" font-weight="800" fill="#06101f">n4</text>
    <circle cx="818" cy="134" r="17" fill="#ffb547"/><text x="818" y="139" text-anchor="middle" class="t" font-size="12" font-weight="800" fill="#06101f">n5</text>

    <text x="930" y="166" text-anchor="middle" class="t" font-size="30" font-weight="800" fill="#eef0ff">24</text>
    <text x="930" y="188" text-anchor="middle" class="mono" font-size="11" fill="#8a93b8" letter-spacing="1.5">SHARDS LED</text>
  </g>
</svg>
