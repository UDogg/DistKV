# Client SDKs and the dashboard. Every SDK is checked against the routing
# vectors generated by the Go servers, then against a live cluster.
name: Polyglot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Go routing vectors are up to date
        run: go test ./internal/cluster -run TestRoutingVectors

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - working-directory: clients/python
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: clients/typescript
        run: npm ci && npm test && npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - working-directory: clients/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check and rebuild the embedded dashboard
        run: npm ci --prefix web/dashboard && npm run build --prefix web/dashboard
      - name: Embedded bundle is up to date
        run: git diff --exit-code -- internal/ui/dist || (echo "run 'make ui' and commit internal/ui/dist" && exit 1)

  live-cluster:
    needs: [python, typescript, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Start a 5-node cluster via the demo supervisor
        run: |
          make build
          bin/distkv-demo --fresh --dir /tmp/demo --rate 300 > /tmp/demo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/demo/info && break; sleep 1; done
      - name: Every SDK against the live cluster
        env:
          DISTKV_ENDPOINTS: http://127.0.0.1:7101,http://127.0.0.1:7103
        run: |
          (cd clients/python && python3 -m unittest tests.test_client -v)
          (cd clients/typescript && npm ci && npm test)
          (cd clients/rust && cargo test -- --include-ignored)
          clients/rust/target/debug/distkv-top --once --endpoints $DISTKV_ENDPOINTS
      - if: failure()
        run: tail -100 /tmp/demo.log /tmp/demo/*/node.log
